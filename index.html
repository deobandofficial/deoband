async function chatChans(){const c=S.chat;try{c.chs=await api('chat_channels',{p_token:S.token})||[];c.chErr='';if(!c.cur||!curCh())c.cur=(c.chs[0]||{}).id||null}catch(e){c.chErr=e.message}}
async function chatMsgs(mark){
  const c=S.chat;if(!c.cur)return;
  try{
    const m=await api('chat_messages',{p_token:S.token,p_channel:c.cur,p_limit:150}),sig=JSON.stringify(m),changed=sig!==c.sig;

function drawChans(){const el=$('chans');if(!el)return;el.innerHTML=S.chat.chs.map(c=>`<button class="chb ${c.id===S.chat.cur?'on':''}" data-a="c_chan" data-id="${c.id}"># ${esc(c.name)}${c.unread?`<i class="dot">${c.unread>99?'99+':c.unread}</i>`:''}</button>`).join('')}

function drawMsgs(stick){
  const el=$('msgs');if(!el)return;const c=S.chat,near=el.scrollHeight-el.scrollTop-el.clientHeight<90,pins=c.msgs.filter(m=>m.pinned);
  el.innerHTML=(pins.length?`<div class="pins">📌 Pinned<br>${pins.slice(-3).map(m=>'<b>'+esc(m.author)+':</b> '+esc(m.body.slice(0,140))).join('<br>')}</div>`:'')+(c.msgs.length?c.msgs.map(msgHtml).join(''):'<p class="mute">No messages yet.</p>');
  if((c.stick&&c.msgs.length)||(stick&&near)){el.scrollTop=el.scrollHeight;c.stick=false}
}
function drawBan(){
  const el=$('cban');if(!el)return;const c=S.chat;el.style.display=(c.reply||c.editId)?'flex':'none';
  el.innerHTML=c.editId?'<span>Editing your message</span><button class="lnk" data-a="c_cancel">Cancel</button>':c.reply?`<span>Replying to <b>${esc(c.reply.name)}</b>: ${esc(c.reply.snip)}</span><button class="lnk" data-a="c_cancel">Cancel</button>`:'';
}
async function chatClick(a,id,k){
  const c=S.chat,say=m=>{const e=$('cerr');if(e)e.textContent=m||''};
  try{
    say('');
    if(a==='c_chan'){Object.assign(c,{cur:id,sig:'',msgs:[],reply:null,editId:null,pick:null,arm:null,stick:true,needMark:true});render();return}
    if(a==='c_reply'){const m=c.msgs.find(x=>x.id===id);c.reply={id,name:m.author,snip:m.body.slice(0,60)};c.editId=null;drawBan();if($('c_msg'))$('c_msg').focus();return}
    if(a==='c_cancel'){c.reply=null;c.editId=null;if($('c_msg'))$('c_msg').value='';drawBan();return}
    if(a==='c_edit'){const m=c.msgs.find(x=>x.id===id);c.editId=id;c.reply=null;drawBan();$('c_msg').value=m.body;$('c_msg').focus();return}
    if(a==='c_pick'){c.pick=c.pick===id?null:id;drawMsgs();return}
    if(a==='c_react'){c.pick=null;await api('chat_react',{p_token:S.token,p_id:id,p_emoji:k})}
    else if(a==='c_del'){if(c.arm!==id){c.arm=id;drawMsgs();return}c.arm=null;await api('chat_delete',{p_token:S.token,p_id:id})}
    else if(a==='c_pin'){const m=c.msgs.find(x=>x.id===id);await api('chat_pin',{p_token:S.token,p_id:id,p_pinned:!m.pinned})}
    else if(a==='c_send'){const t=($('c_msg').value||'').trim();if(!t)return;
      if(c.editId){await api('chat_edit',{p_token:S.token,p_id:c.editId,p_body:t});c.editId=null}
      else await api('chat_send',{p_token:S.token,p_channel:c.cur,p_body:t,p_reply:c.reply?c.reply.id:null});
      c.reply=null;$('c_msg').value='';drawBan();c.stick=true}
    c.sig='';await chatMsgs(true);
  }catch(e){say(e.message)}
}

const VAPID_PUBLIC='BOpVQusdEMKIovygBkCswXaRYukQp52CuWepsFj7Tieap11Z7GB9D12oX0rbcYkLzzgViCvNeJ1Ea2dhmfOC9Ok';
S.push={on:false};
const pushOK=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent),standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone;
const b64u=s=>{const b=atob((s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))};
async function pushSub(){const r=await navigator.serviceWorker.getRegistration();return r?r.pushManager.getSubscription():null}
async function pushSave(s){const j=s.toJSON();await api('push_save',{p_token:S.token,p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth})}
async function pushState(){try{S.push.on=pushOK()&&Notification.permission==='granted'&&!!(await pushSub())}catch(e){S.push.on=false}}
async function pushSync(){try{if(pushOK()&&Notification.permission==='granted'){const s=await pushSub();if(s)await pushSave(s)}}catch(e){}}
async function pushEnable(){
  if(await Notification.requestPermission()!=='granted')throw new Error('Notifications are blocked. Allow them in your browser or phone settings, then try again.');
  const reg=await navigator.serviceWorker.register('sw.js');await navigator.serviceWorker.ready;
  const s=(await reg.pushManager.getSubscription())||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID_PUBLIC)});
  await pushSave(s);S.push.on=true;
}
async function pushDrop(unsub){try{const s=await pushSub();if(s){await api('push_remove',{p_token:S.token,p_endpoint:s.endpoint});if(unsub)await s.unsubscribe()}}catch(e){}}
async function pushDisable(){await pushDrop(true);S.push.on=false}
function pushCard(){
  let b;
  if(!pushOK())b='<div class="mute">'+(isIOS&&!standalone?'On iPhone or iPad, tap Share, then Add to Home Screen. Open the site from your home screen and come back here.':"This browser doesn't support notifications.")+'</div>';
  else if(Notification.permission==='denied')b='<div class="mute">Notifications are blocked for this site. Allow them in your browser or phone settings, then come back.</div>';
  else b=S.push.on?'<button class="b alt" data-a="pushOff">Turn off on this device</button>':'<button class="b" data-a="pushOn">Turn on notifications</button>';
  return `<h2>Notifications</h2><div class="card"><div class="mute" style="margin-bottom:12px">Get alerts for new chat messages, rehearsals and events. This is set per device.</div>${msgs('push')}${b}</div>`;
}

  const list=past.map(x=>{
    const who=S.m.map(m=>{const s=pr(x.id,m.id);
      return`<div style="margin-top:10px"><div>${esc(m.name)}${adm()?'':` <span class="mute">· ${L[s]}</span>`}</div>`+(adm()?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">${btn(x.id,m.id,'a','Attended',s==='attended')}${btn(x.id,m.id,'e','Excused',s==='excused')}${btn(x.id,m.id,'n','No show',s==='no_show')}</div>`:'')+'</div>'}).join('');
    return`<div class="card ev">${chip(x.day)}<div class="body" style="flex:1;min-width:0"><div class="when">${esc(x.k)}</div><div class="mute">${x.at?esc(x.at):'Time TBC'}${x.place?' · '+esc(x.place):''}</div>${adm()?`<div style="margin-top:10px"><button class="b alt" style="padding:7px 12px" data-a="attAll" data-id="${x.id}">Everyone attended</button></div>`:''}${who}</div></div>`}).join('');
  return h+`<p class="mute">${adm()?'Take attendance on the day: tap a status for each member, tap again to clear.':'Attendance is set by the admins.'}</p><div class="grid">${rows}</div><div class="lbl" style="margin:18px 0 8px">By date</div>${list}`}
function partsHtml(x,s,i){
  const ps=(x.parts||{})[s]||[],key=x.id+'|'+i,nm=id=>{const m=S.m.find(y=>y.id===id);return m?m.name:'?'};
  let h=ps.map((p,j)=>`<div class="mute" style="font-size:13px${p.w===S.me.id?';color:var(--acct);font-weight:700':''}">${esc(nm(p.w))}: ${esc(p.t)}${adm()?`<button class="lnk" style="margin:0 0 0 8px;padding:0" data-a="pDel" data-id="${x.id}" data-k="${i}:${j}">×</button>`:''}</div>`).join('');
  if(adm())h+=S.pOpen===key?`<div style="margin:6px 0 12px;display:flex;gap:6px;flex-wrap:wrap"><select id="p_who" style="flex:1;min-width:110px;margin:0">${S.m.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select><input id="p_what" placeholder="Does what? e.g. lead vocals" style="flex:2;min-width:150px;margin:0"><button class="b" style="padding:9px 14px" data-a="pAdd" data-id="${x.id}" data-k="${i}">Add</button></div>`:`<button class="lnk" style="padding:2px 0;font-size:11px" data-a="pOpen" data-id="${key}">+ Who does what</button>`;
  return h}
function prefCard(){
  const f=S.pf,LB='display:flex;align-items:center;gap:10px;margin:8px 0;font:inherit;letter-spacing:0;text-transform:none;color:var(--ink)';
  const row=(at,v,l,on)=>`<label style="${LB}"><input type="checkbox" style="width:auto;margin:0" ${at}="${esc(v)}"${on?' checked':''}> ${esc(l)}</label>`;
  return`<h2>Notification settings</h2><div class="card">${row('data-pf','chat','Chat messages',f.chat)}${row('data-pf','sched','New rehearsals and events',f.sched)}${row('data-pf','remind','Reminders (evening before, morning of)',f.remind)}`+
  (S.chat.chs.length?`<div class="lbl" style="margin:16px 0 4px">Mute channels</div>`+S.chat.chs.map(c=>row('data-pm',c.id,'#'+c.name,(f.muted||[]).indexOf(c.id)>=0)).join(''):'')+'</div>'}

document.addEventListener('change',e=>{
  const t=e.target,d=t.dataset||{};
  if(d.pf||d.pm){const f=S.pf;if(d.pf)f[d.pf]=t.checked;else{const m=new Set(f.muted||[]);if(t.checked)m.add(d.pm);else m.delete(d.pm);f.muted=[...m]}
    api('prefs_save',{p_token:S.token,p_chat:f.chat,p_sched:f.sched,p_remind:f.remind,p_muted:f.muted}).catch(x=>{S.err=x.message;render()});return}
  if(e.target.id!=='t_logo'||!e.target.files[0])return;
  const rd=new FileReader();
  rd.onload=()=>{const im=new Image();
    im.onload=()=>{const sc=Math.min(1,256/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*sc));c.height=Math.max(1,Math.round(im.height*sc));
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);keepDraft();S.draft.logo=c.toDataURL('image/png');S.err='';render()};
    im.onerror=()=>{S.err='That image could not be read. Try a PNG or JPG.';render()};im.src=rd.result};
  rd.readAsDataURL(e.target.files[0]);
});

document.addEventListener('click',e=>{
  const eb=e.target.closest('[data-eye]');
  if(eb){const i=$(eb.dataset.eye);if(i){const show=i.type==='password';i.type=show?'text':'password';eb.classList.toggle('on',show);const t=show?'Hide password':'Show password';eb.setAttribute('aria-label',t);eb.title=t}return}
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id,k=b.dataset.k;
  if(a==='visuals'){window.open('https://deobandofficial.github.io/band-visuals/','_blank','noopener');return}
  if(a==='theme'){const n=THEMES[(THEMES.indexOf(getTheme())+1)%3];try{localStorage.setItem('bandTheme',n)}catch(x){}applyTheme(n);return}
  if(a.indexOf('c_')===0){chatClick(a,id,k);return}
  S.sc=a==='chgpw'?'pw':a.indexOf('push')===0?'push':'';
  run(async()=>{
    if(a==='tab'){S.tab=id;S.pwOn=false;S.edit=S.reset=S.arm=S.editM=S.draft=null;if(id==='chat')Object.assign(S.chat,{tried:false,sig:'',msgs:[],reply:null,editId:null,pick:null,arm:null,stick:true,needMark:true});if(id==='settings'){await pushState();try{S.pf=await api('prefs_get',{p_token:S.token})||S.pf}catch(x){}await chatChans()}}
    else if(a==='mode'){S.mode=id}
    else if(a==='logout'){await pushDrop(false);S.pushSynced=false;S.pwOn=false;S.pws={};try{await api('logout',{p_token:S.token})}catch(x){}S.token=null;S.me=null;S.draft=null;S.chat.chs=[];S.chat.tried=false;store(null);S.mode='login';S.tab='overview'}
    else if(a==='setup'){const n=v('s_name'),r=v('s_role'),u=v('s_user').toLowerCase(),p=raw('s_pw');if(!n||!r){S.err='Needs a name and a role.';return}if(pwBad(p)){S.err='Password needs at least 8 characters.';return}
      start(await api('setup_admin',{p_username:u,p_name:n,p_role:r,p_password:p}));api('pw_keep',{p_token:S.token,p_password:p}).catch(()=>{});S.setup=false;await refresh()}
    else if(a==='signup'){const n=v('g_name'),r=v('g_role'),u=v('g_user').toLowerCase(),p=raw('g_pw');if(!n||!r){S.err='Needs a name and a role.';return}
      if(pwBad(p)){S.err='Password needs at least 8 characters.';return}if(p!==raw('g_pw2')){S.err="The two passwords don't match.";return}
      await api('signup',{p_username:u,p_name:n,p_role:r,p_password:p});S.mode='login';S.ok='Request sent. An admin has to approve you before you can log in.'}
    else if(a==='login'){const pw=raw('u_pw'),res=await api('login',{p_username:v('u_user').toLowerCase(),p_password:pw});if(res&&res.token)api('pw_keep',{p_token:res.token,p_password:pw}).catch(()=>{});
      if(res.token){start(res.token);await refresh()}else S.err=res.error==='locked'?'Too many tries. Wait 5 minutes.':res.error==='pending'?'Your account is waiting for approval.':'Wrong username or password.'}
    else if(a==='chadd'){const n=v('k_name');if(!n){S.err='Give the channel a name.';return}await api('chat_channel_save',{p_token:S.token,p_id:null,p_name:n,p_kind:raw('k_kind')||'normal'});await chatChans();S.ok='Channel added.'}
    else if(a==='chrenOpen'){S.chat.rename=S.chat.rename===id?null:id;const c=S.chat.chs.find(x=>x.id===id);S.fill={r_name:c?c.name:''}}
    else if(a==='chrenSave'){const c=S.chat.chs.find(x=>x.id===id);await api('chat_channel_save',{p_token:S.token,p_id:id,p_name:v('r_name'),p_kind:c.kind});S.chat.rename=null;await chatChans()}
    else if(a==='chdel'){if(S.arm!==id){S.arm=id;return}S.arm=null;await api('chat_channel_delete',{p_token:S.token,p_id:id});await chatChans()}
    else if(a==='pushOn'){await pushEnable();S.ok='Notifications are on for this device.'}
    else if(a==='pushOff'){await pushDisable();S.ok='Notifications are off for this device.'}
    else if(a==='pwTog'){S.pwOn=!S.pwOn;if(S.pwOn)S.pws=await api('pw_show',{p_token:S.token})||{}}
    else if(a==='attSet'){const q=k.split(':'),want={a:'attended',e:'excused',n:'no_show'}[q[1]],cur=(S.att.find(x=>x.i===id&&x.m===q[0])||{}).s;await api('att_set',{p_token:S.token,p_item:id,p_member:q[0],p_status:cur===want?null:want});await refresh()}
    else if(a==='attAll'){await api('att_set_all',{p_token:S.token,p_item:id,p_status:'attended'});await refresh()}
    else if(a==='pOpen'){S.pOpen=S.pOpen===id?null:id}
    else if(a==='pAdd'){const x=S.s.find(y=>y.id===id),sg=(x.songs||[])[+k],t=v('p_what'),w=raw('p_who');if(!t){S.err='Say what they do.';return}
      const ps=Object.assign({},x.parts||{});ps[sg]=(ps[sg]||[]).concat([{w:w,t:t}]);await write('save_parts',{p_id:id,p_parts:ps})}
    else if(a==='pDel'){const x=S.s.find(y=>y.id===id),ij=k.split(':'),sg=(x.songs||[])[+ij[0]],ps=Object.assign({},x.parts||{});
      ps[sg]=(ps[sg]||[]).filter((_,n)=>n!==+ij[1]);if(!ps[sg].length)delete ps[sg];await write('save_parts',{p_id:id,p_parts:ps})}
    else if(a==='notice'){await write('save_notice',{p_notice:$('o_note').value.trim()});S.ok='Saved.'}
    else if(a==='rmlogo'){keepDraft();S.draft.logo=''}
    else if(a==='saveSet'){keepDraft();const d=S.draft;if(!d.band){S.err='Band name is required.';return}
      await write('save_settings',{p_band:d.band,p_tagline:d.tagline,p_accent:S.meta.accent||'blue',p_logo:d.logo});S.draft=null;S.ok='Settings saved.'}
    else if(a==='add'){const d={p_id:null,p_day:v('f_date'),p_at:v('f_time'),p_place:v('f_place'),p_notes:v('f_notes')};
      if(!d.p_day){S.err='Needs a date.';return}
      if(k==='e'){d.p_title=v('f_title');if(!d.p_title){S.err='Needs a name and a date.';return}}
      await write(k==='r'?'save_rehearsal':'save_event',d)}
    else if(a==='del'){if(S.arm!==id){S.arm=id;return}S.arm=null;
      if(k==='m')await write('remove_member',{p_id:id});else if(k==='p')await write('reject_member',{p_id:id});else await write('delete_item',{p_kind:{r:'rehearsal',e:'event',s:'setlist'}[k],p_id:id})}
    else if(a==='editS'){S.edit=id;const x=S.s.find(y=>y.id===id);S.fill={l_name:x.name,l_songs:(x.songs||[]).join('\n')}}
    else if(a==='cancelS'){S.edit=null}
    else if(a==='saveS'){const songs=$('l_songs').value.split('\n').map(x=>x.trim()).filter(Boolean),name=v('l_name');
      if(!name||!songs.length){S.err='Needs a name and at least one song.';return}
      await write('save_setlist',{p_id:S.edit||null,p_name:name,p_songs:songs});S.edit=null}
    else if(a==='approve'){await write('approve_member',{p_id:id})}
    else if(a==='editOpen'){S.editM=S.editM===id?null:id;const x=S.m.find(y=>y.id===id);S.fill={e_name:x.name,e_role:x.role}}
    else if(a==='editSave'){await write('edit_member',{p_id:id,p_name:v('e_name'),p_role:v('e_role')});S.editM=null}
    else if(a==='admin'){const m=S.m.find(x=>x.id===id);await write('set_admin',{p_id:id,p_admin:!m.is_admin})}
    else if(a==='resetOpen'){S.reset=S.reset===id?null:id}
    else if(a==='resetDo'){const p=raw('n_pw');if(pwBad(p)){S.err='Password needs at least 8 characters.';return}await write('reset_password',{p_id:id,p_password:p});S.reset=null;S.ok='Password changed. Tell them the new one yourself.'}
    else if(a==='chgpw'){const o=raw('c_old'),n=raw('c_new');if(pwBad(n)){S.err='New password needs at least 8 characters.';return}await write('change_password',{p_old:o,p_new:n});api('pw_keep',{p_token:S.token,p_password:n}).catch(()=>{});S.ok='Password changed.'}
  });
});
</script></body></html>
